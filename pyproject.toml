[project]
name = "document-extraction"
version = "0.1.0"
description = "Receipt and invoice extraction API with an eval harness"
requires-python = ">=3.12"
dependencies = [
    "fastapi",
    "uvicorn[standard]",
    "python-multipart",
    "pydantic",
    "python-dotenv",
    "openai",
    "httpx",
    "pillow",
    "rapidfuzz",
    "pypdfium2>=5.14.0",
]

[dependency-groups]
dev = ["pytest"]

# No [build-system]: uv treats this as a virtual project and does not install
# the source tree, so `app` and `evals` are imported from the repo root.
[tool.pytest.ini_options]
pythonpath = ["."]
